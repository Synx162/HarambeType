<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .grp  { fill:#f6f8fa; stroke:#57606a; stroke-width:1.5; rx:10; }
      .ctl  { fill:#fff8e1; stroke:#b08800; stroke-width:1.5; rx:10; }
      .vga  { fill:#e8f1ff; stroke:#0969da; stroke-width:1.5; rx:10; }
      .ext  { fill:#ffffff; stroke:#57606a; stroke-width:1.2; stroke-dasharray:5 4; rx:8; }
      .mod  { fill:#ffffff; stroke:#8c959f; stroke-width:1; rx:5; }
      .t    { font-size:15px; font-weight:bold; fill:#1f2328; }
      .m    { font-size:12.5px; fill:#1f2328; font-family: Menlo, Consolas, monospace; }
      .s    { font-size:11.5px; fill:#57606a; }
      .lbl  { font-size:11.5px; fill:#333; }
      .w    { stroke:#333; stroke-width:1.6; fill:none; marker-end:url(#a); }
    </style>
  </defs>
  <rect width="1120" height="520" fill="#ffffff"/>

  <!-- external inputs -->
  <rect class="ext" x="16" y="62" width="112" height="56"/>
  <text class="t" x="72" y="86" text-anchor="middle">PS/2</text>
  <text class="s" x="72" y="104" text-anchor="middle">keyboard</text>

  <rect class="ext" x="16" y="352" width="112" height="76"/>
  <text class="t" x="72" y="376" text-anchor="middle">Buttons</text>
  <text class="s" x="72" y="394" text-anchor="middle">KEY0 reset</text>
  <text class="s" x="72" y="408" text-anchor="middle">KEY1 new words</text>
  <text class="s" x="72" y="422" text-anchor="middle">KEY2 start</text>

  <!-- input decode -->
  <rect class="grp" x="170" y="30" width="230" height="130"/>
  <text class="t" x="285" y="52" text-anchor="middle">Keyboard input</text>
  <rect class="mod" x="186" y="64" width="198" height="38"/>
  <text class="m" x="285" y="81" text-anchor="middle">ps2_receiver</text>
  <text class="s" x="285" y="96" text-anchor="middle">2-FF sync, 11-bit frame shift</text>
  <rect class="mod" x="186" y="110" width="198" height="38"/>
  <text class="m" x="285" y="127" text-anchor="middle">scancode_to_fontIndex</text>
  <text class="s" x="285" y="142" text-anchor="middle">drop F0/E0, map a–z, space → 0–26</text>

  <!-- word source -->
  <rect class="grp" x="170" y="196" width="230" height="130"/>
  <text class="t" x="285" y="218" text-anchor="middle">Word source</text>
  <rect class="mod" x="186" y="230" width="198" height="38"/>
  <text class="m" x="285" y="247" text-anchor="middle">word_randomizer</text>
  <text class="s" x="285" y="262" text-anchor="middle">8-bit LFSR, no-repeat picks</text>
  <rect class="mod" x="186" y="276" width="198" height="38"/>
  <text class="m" x="285" y="293" text-anchor="middle">target_words</text>
  <text class="s" x="285" y="308" text-anchor="middle">200-word dictionary, streams 49</text>

  <!-- control -->
  <rect class="ctl" x="450" y="30" width="230" height="382"/>
  <text class="t" x="565" y="52" text-anchor="middle">Control  (main.v)</text>
  <text class="s" x="565" y="74" text-anchor="middle">phase latches:</text>
  <text class="s" x="565" y="89" text-anchor="middle">preload → typing → post-game</text>
  <rect class="mod" x="466" y="102" width="198" height="34"/>
  <text class="s" x="565" y="123" text-anchor="middle">preload FSM (3 states)</text>
  <rect class="mod" x="466" y="142" width="198" height="34"/>
  <text class="s" x="565" y="163" text-anchor="middle">keystroke gate + text cursor (34×7)</text>
  <rect class="mod" x="466" y="182" width="198" height="34"/>
  <text class="m" x="565" y="204" text-anchor="middle">countdown_timer</text>
  <rect class="mod" x="466" y="222" width="198" height="34"/>
  <text class="s" x="565" y="243" text-anchor="middle">box-clear FSM + draw arbiter</text>
  <rect class="mod" x="466" y="262" width="198" height="34"/>
  <text class="s" x="565" y="283" text-anchor="middle">BCD split → HEX0–HEX5</text>

  <!-- scoring -->
  <rect class="grp" x="730" y="30" width="230" height="176"/>
  <text class="t" x="845" y="52" text-anchor="middle">Scoring</text>
  <rect class="mod" x="746" y="64" width="198" height="38"/>
  <text class="m" x="845" y="81" text-anchor="middle">done_list</text>
  <text class="s" x="845" y="96" text-anchor="middle">40×8 letters held in registers</text>
  <rect class="mod" x="746" y="110" width="198" height="38"/>
  <text class="m" x="845" y="127" text-anchor="middle">comparator</text>
  <text class="s" x="845" y="142" text-anchor="middle">char / word error counters</text>
  <rect class="mod" x="746" y="156" width="198" height="38"/>
  <text class="m" x="845" y="173" text-anchor="middle">stats_calculator</text>
  <text class="s" x="845" y="188" text-anchor="middle">WPM, accuracy → BCD</text>

  <!-- rendering -->
  <rect class="grp" x="730" y="236" width="230" height="176"/>
  <text class="t" x="845" y="258" text-anchor="middle">Glyph drawers</text>
  <rect class="mod" x="746" y="268" width="198" height="26"/>
  <text class="m" x="845" y="286" text-anchor="middle">preload_to_pixel_draw</text>
  <rect class="mod" x="746" y="300" width="198" height="26"/>
  <text class="m" x="845" y="318" text-anchor="middle">char_to_pixel_draw</text>
  <rect class="mod" x="746" y="332" width="198" height="26"/>
  <text class="m" x="845" y="350" text-anchor="middle">stats_to_pixel_draw</text>
  <text class="s" x="845" y="380" text-anchor="middle">font_mem (A–Z) · num_mem (0–9)</text>
  <text class="s" x="845" y="396" text-anchor="middle">8×8 glyphs, scaled ×2 / ×3</text>

  <!-- vga -->
  <rect class="vga" x="730" y="440" width="230" height="64"/>
  <text class="m" x="845" y="462" text-anchor="middle" font-weight="bold">vga_adapter</text>
  <text class="s" x="845" y="480" text-anchor="middle">2 × 640×480×3-bit framebuffers</text>
  <text class="s" x="845" y="495" text-anchor="middle">game screen / results screen</text>

  <rect class="ext" x="1000" y="444" width="104" height="56"/>
  <text class="t" x="1052" y="468" text-anchor="middle">VGA</text>
  <text class="s" x="1052" y="486" text-anchor="middle">640×480 @ 60 Hz</text>

  <rect class="ext" x="490" y="440" width="150" height="56"/>
  <text class="t" x="565" y="464" text-anchor="middle">HEX0–HEX5</text>
  <text class="s" x="565" y="482" text-anchor="middle">live timer + errors</text>

  <!-- wires -->
  <path class="w" d="M128,90 H168"/>
  <path class="w" d="M400,95 H448"/>
  <text class="lbl" x="424" y="86" text-anchor="middle">char</text>
  <path class="w" d="M128,390 H448"/>
  <path class="w" d="M400,252 H448"/>
  <text class="lbl" x="424" y="244" text-anchor="middle">target</text>
  <path class="w" d="M680,83 H744"/>
  <text class="lbl" x="712" y="76" text-anchor="middle">target</text>
  <path class="w" d="M680,129 H744"/>
  <text class="lbl" x="712" y="122" text-anchor="middle">typed</text>
  <path class="w" d="M680,300 H728"/>
  <text class="lbl" x="704" y="292" text-anchor="middle">draw</text>
  <path class="w" d="M960,175 H1000 V312 H962"/>
  <text class="lbl" x="1006" y="246">BCD</text>
  <path class="w" d="M845,412 V438"/>
  <text class="lbl" x="852" y="430">x, y, color, write (via arbiter)</text>
  <path class="w" d="M960,472 H998"/>
  <path class="w" d="M565,412 V438"/>
</svg>
